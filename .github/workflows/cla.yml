# CLA Assistant Lite: asks first-time contributors to sign CLA.md by commenting on their pull request.
# https://github.com/contributor-assistant/github-action
#
# Note: the upstream repository was archived in 2026 (read-only, no further releases). v2.6.1 still works
# and is pinned to its commit SHA below, so a moved tag can't change what runs with write permissions.
#
# One-time setup by the repository owner:
#   Create an unprotected branch named "cla-signatures" (e.g. from main). The bot commits
#   signatures/version1/cla.json there; don't create that file yourself.
name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Explicit, in case the repository's default GITHUB_TOKEN permissions are read-only.
permissions:
  actions: write
  contents: write # commits the signatures file to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/ronalddev-arch/AudioSwitch/blob/main/CLA.md"
          path-to-signatures: "signatures/version1/cla.json"
          branch: "cla-signatures" # must exist and must not be protected
          # The Project Owner (ronalddev-arch) doesn't sign.
          allowlist: "ronalddev-arch,dependabot[bot],github-actions[bot]"
          lock-pullrequest-aftermerge: true
